<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>电影院 · 设计预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d8cfb8;font-family:"PingFang SC",system-ui,sans-serif;color:#4e5947}button{font:inherit;border:0;cursor:pointer}#scene{position:fixed;inset:0}#scene canvas{width:100%;height:100%;display:block}.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 37%,transparent 25%,#22291818 75%,#22291842);}
.top{position:fixed;top:26px;left:32px;right:32px;display:flex;align-items:center;justify-content:space-between}.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border-radius:28px;background:#faf4e5ed;color:#55624c;font-size:14px;box-shadow:0 5px 25px #252d1c10}.pill.green{background:#8d9d7ae8;color:#fff9ec}.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.playbar{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;background:#faf4e5e8;box-shadow:0 10px 30px #1c221d18;border:1px solid #fff8;backdrop-filter:blur(10px);padding:10px 15px;border-radius:32px;color:#67745d}.playbar button{display:grid;place-items:center;background:none;color:inherit;width:36px;height:36px;border-radius:50%}.playbar button.main{background:#899b75;color:white;width:42px;height:42px}.playbar .count{font-size:12px;min-width:34px;text-align:center;color:#8a907e}.playbar .divide{height:20px;width:1px;background:#b5b89e66}.playbar svg{width:19px;height:19px}.dots{position:fixed;bottom:106px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.dot{height:5px;width:5px;border-radius:5px;background:#f9f0d75e}.dot.active{width:18px;background:#fff8e9}
.scrim{position:fixed;inset:0;background:#2e35262a;backdrop-filter:blur(3px)}.panel{position:fixed;right:24px;top:24px;bottom:24px;width:380px;border-radius:26px;background:#fffaf0;box-shadow:0 20px 70px #28301c30;padding:25px;color:#55614d;display:flex;flex-direction:column;gap:22px}.panel header{display:flex;justify-content:space-between;align-items:center}.panel h2{font-size:19px;font-weight:500;margin:0}.panel .x{background:#f0eedf;color:#738269;width:32px;height:32px;border-radius:50%;font-size:20px}.upload{border-radius:18px;background:#eef0e2;color:#748366;display:flex;align-items:center;justify-content:center;gap:9px;min-height:62px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.thumb{position:relative;border-radius:12px;padding:5px;background:#efecdf;aspect-ratio:1;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain;border-radius:9px}.thumb .number{position:absolute;left:9px;bottom:9px;border-radius:6px;padding:3px 6px;font-size:10px;background:#fffa;color:#626d54}.thumb .remove{position:absolute;right:8px;top:8px;background:#fffc;border-radius:50%;width:19px;height:19px;text-align:center;font-size:13px;color:#7d876b}.move{display:flex;justify-content:center;gap:15px;margin-top:8px;color:#89977c;font-size:11px}.subhead{font-size:13px;color:#7c876f}.music{background:#f2efe3;border-radius:15px;min-height:70px;display:flex;gap:12px;align-items:center;padding:15px;font-size:13px}.music small{display:block;color:#a0a28e;font-size:11px;margin-top:5px}.music .replace{margin-left:auto;background:none;color:#869975;font-size:12px}.panel footer{margin-top:auto}.panel footer button{width:100%;background:#899b75;border-radius:20px;padding:13px;color:#fffbed;font-size:14px}.note{color:#a3a895;font-size:11px;margin-top:-13px}.film-tag{position:fixed;bottom:28px;left:32px;font-size:12px;color:#f9f3e3;letter-spacing:1px;display:none}body.film .film-tag{display:block}
@media(max-width:650px){.top{left:18px;right:18px;top:18px}.panel{inset:16px;width:auto}.playbar{bottom:20px;gap:12px}.pill{padding:11px 16px}}
</style>
<div id="scene"></div><div class="shade"></div>
<div class="top"><button class="pill"><svg class="icon" viewBox="0 0 20 20"><path d="m9 4-6 6 6 6M3 10h14"/></svg>小屋</button><button class="pill green" id="edit"><svg class="icon" viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="14" rx="2"/><circle cx="7" cy="7" r="1.5"/><path d="m3 15 5-5 3 3 3-4 4 5"/></svg>放映清单</button></div>
<div class="dots"><i class="dot active"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
<div class="playbar"><button aria-label="上一张"><svg class="icon" viewBox="0 0 20 20"><path d="m12 4-6 6 6 6"/></svg></button><button class="main" aria-label="播放"><svg class="icon" viewBox="0 0 20 20" style="fill:currentColor;stroke:none"><path d="m7 4 9 6-9 6Z"/></svg></button><button aria-label="下一张"><svg class="icon" viewBox="0 0 20 20"><path d="m7 4 6 6-6 6"/></svg></button><span class="count">1 / 6</span><span class="divide"></span><button aria-label="静音"><svg class="icon" viewBox="0 0 20 20"><path d="M3 8h3l5-4v12l-5-4H3ZM15 6a6 6 0 0 1 0 8"/></svg></button></div>
<div id="editor" hidden><div class="scrim"></div><section class="panel"><header><h2>放映清单</h2><button class="x" id="close">×</button></header><button class="upload"><svg class="icon" viewBox="0 0 20 20"><path d="M10 3v14M3 10h14"/></svg>添加照片</button><div id="photo-grid" class="grid"></div><div class="subhead">音乐</div><div class="music"><svg class="icon" viewBox="0 0 20 20"><path d="M8 14V4l8-2v10M8 7l8-2"/><ellipse cx="5" cy="15" rx="3" ry="2"/><ellipse cx="13" cy="13" rx="3" ry="2"/></svg><span>音乐示例.mp3</span><button class="replace">替换</button></div><footer><button>保存</button></footer></section></div>
<div class="film-tag">胶片过片 · 转场瞬间</div>
<script type="importmap">{"imports":{"three":"../../dist/assets/three.module.js"}}</script>
<script type="module" src="./preview.js"></script>
</html>
