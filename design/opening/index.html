<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>little us. · 开场方案</title>
<style>
:root{color-scheme:light;--ink:#56604c;--paper:#fbf8ed;--green:#879477}*{box-sizing:border-box}body{margin:0;background:#eeede3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #7e8d70;outline-offset:5px}.top{position:absolute;z-index:30;left:32px;right:32px;top:26px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font:italic 23px Georgia,serif}.switch{display:flex;background:#ffffff80;padding:5px;border-radius:40px;gap:4px}.switch button{border:0;background:transparent;padding:11px 19px;border-radius:30px;font-size:12px}.switch button[aria-pressed="true"]{background:var(--green);color:#fffef4}.reset{border:1px solid #6d795533;background:transparent;border-radius:30px;padding:10px 15px;font-size:12px}.stage{min-height:100svh;position:relative;overflow:hidden;display:grid;place-items:center;padding:110px 22px 88px}.scene{width:min(610px,90vw);height:470px;display:grid;place-items:center;position:relative}.scene[hidden]{display:none}.caption{position:absolute;bottom:27px;left:22px;right:22px;text-align:center;font-size:12px;line-height:1.9;letter-spacing:.025em;color:#808675}.caption strong{font-weight:500;display:block;font-size:16px;color:#59654e;margin-bottom:3px}.envelope-wrap{width:min(430px,86vw);height:285px;position:relative;perspective:1200px;filter:drop-shadow(0 22px 22px #67624b24);transition:transform 1s cubic-bezier(.22,.8,.25,1)}.envelope-back{position:absolute;inset:0;border-radius:8px;background:#d9dec8}.letter{position:absolute;left:7%;width:86%;height:340px;bottom:15px;background:var(--paper);border-radius:5px;z-index:2;box-shadow:0 1px 8px #77775e19;padding:25px 25px;text-align:center;opacity:0;transform:translateY(0) scale(.96);transition:opacity .35s,transform 1.15s cubic-bezier(.22,.85,.24,1),box-shadow 1s}.letter h1{font:400 23px "Songti SC","Noto Serif SC",serif;margin:0 0 6px}.letter p{font:13px/1.8 "Songti SC",serif;margin:0;color:#848b73}.letter .room-cut{display:block;width:100%;height:184px;margin-top:8px;object-fit:contain;object-position:50% 54%;mix-blend-mode:multiply;opacity:0;transform:scale(.8) translateY(16px);transition:opacity .7s .8s,transform .8s .7s}.enter-letter{position:absolute;inset:100px 20px 20px;border:0;background:transparent;opacity:0;pointer-events:none}.letter-hint{display:block;font:11px sans-serif;margin-top:3px;opacity:0;transition:opacity .6s 1.2s}.front{position:absolute;inset:0;z-index:4;background:linear-gradient(155deg,#e5e8d8,#d4dbc3);border-radius:0 0 8px 8px;clip-path:polygon(0 0,50% 51%,100% 0,100% 100%,0 100%);box-shadow:inset 0 -1px 0 #afbc9833}.lower-seam{position:absolute;inset:0;z-index:5;background:#e0e5d2;clip-path:polygon(0 100%,50% 47%,100% 100%);border-radius:0 0 8px 8px}.flap{position:absolute;inset:0;z-index:6;background:#e9eddf;clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top;transition:transform .8s cubic-bezier(.4,0,.2,1);backface-visibility:hidden}.seal{position:absolute;left:calc(50% - 25px);top:calc(50% - 25px);width:50px;height:50px;z-index:8;border:1px solid #a5b68e;border-radius:48% 52% 46% 54%;background:#8e9e7c;box-shadow:0 4px 7px #5363402b,inset 0 0 0 4px #9bac86;transition:opacity .3s,transform .6s}.seal svg{width:25px;height:25px;stroke:#e8eddf;fill:none;stroke-width:1.4}.address{position:absolute;left:27px;bottom:27px;z-index:8;pointer-events:none;font:17px "Songti SC",serif;letter-spacing:.14em;color:#788567}.tiny-line{display:block;font:italic 11px Georgia,serif;letter-spacing:.04em;margin-top:8px;color:#94a080}.letter-scene.open .flap{transform:rotateX(180deg);z-index:1}.letter-scene.open .seal{opacity:0;transform:scale(.7);pointer-events:none}.letter-scene.open .envelope-wrap{transform:translateY(146px) scale(.82)}.letter-scene.open .letter{opacity:1;transform:translateY(-240px);box-shadow:0 15px 24px #77775e10}.letter-scene.open .room-cut{opacity:1;transform:scale(1) translateY(0)}.letter-scene.open .enter-letter{opacity:1;pointer-events:auto}.letter-scene.open .letter-hint{opacity:1}
.ktv-scene{width:min(690px,95vw)}.ktv-room{width:100%;height:100%;position:relative;filter:drop-shadow(0 22px 18px #4c4a5930)}.ktv-room svg{display:block;width:100%;height:100%}.screen-button{position:absolute;left:39.1%;top:20.5%;width:28.8%;height:23%;background:transparent;border:0;border-radius:8px;color:#eff0dd;text-align:center;transition:filter .4s}.screen-button .song{display:block;font:16px/1.4 "Songti SC",serif}.screen-button .now{display:block;font-size:9px;letter-spacing:.18em;margin-bottom:9px;color:#c0cbb0}.play{display:grid;place-items:center;width:27px;height:27px;border:1px solid #c6d1b366;border-radius:50%;margin:9px auto 0;font-size:10px;padding-left:2px}.screen-button:hover{filter:brightness(1.3)}.ktv-scene.playing .screen-button{filter:brightness(1.8)}.ktv-scene.playing .ktv-room{transform:scale(1.1);transition:transform 1.2s cubic-bezier(.3,.7,.3,1)}.world{position:fixed;inset:0;z-index:20;background:#eeede3;opacity:0;pointer-events:none;transform:scale(.94);transition:opacity .9s,transform 1.2s}.world.visible{opacity:1;transform:scale(1);pointer-events:auto}.world iframe{border:0;width:100%;height:100%}.world-back{position:absolute;right:25px;bottom:25px;border:1px solid #7f8b6766;background:#fbf9efed;padding:11px 18px;border-radius:24px;color:#627351}.entering .top{opacity:0;pointer-events:none;transition:opacity .35s}.veil{position:fixed;inset:0;background:#eeeedd;z-index:19;opacity:0;pointer-events:none;transition:opacity .6s}.entering .veil{opacity:1}
@media(max-width:600px){.top{left:18px;right:18px;top:19px;flex-wrap:wrap}.brand{font-size:19px}.switch{order:3;margin:auto}.switch button{padding:9px 17px}.reset{font-size:10px;padding:8px 11px}.scene{height:420px}.envelope-wrap{height:235px}.letter{height:320px;padding:20px 18px}.letter h1{font-size:21px}.letter .room-cut{height:172px}.letter-scene.open .envelope-wrap{transform:translateY(138px) scale(.78)}.letter-scene.open .letter{transform:translateY(-232px)}.address{font-size:16px;bottom:22px;left:24px}.ktv-scene{height:340px}.screen-button .now{font-size:7px;margin-bottom:5px}.screen-button .song{font-size:12px}.play{width:21px;height:21px;margin-top:5px}.caption{font-size:11px;bottom:26px}.caption strong{font-size:15px}.stage{padding-top:134px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top"><span class="brand">little us.</span><nav class="switch" aria-label="开场方案"><button id="choose-letter" aria-pressed="true">A · 一封信</button><button id="choose-ktv" aria-pressed="false">B · 私人 KTV</button></nav><button class="reset" id="replay">重新体验</button></header>
<main class="stage">
<section class="scene letter-scene" id="letter-scene" aria-label="信封开场方案">
<div class="envelope-wrap"><div class="envelope-back"></div><article class="letter"><h1>很高兴认识你。</h1><p>把喜欢的日子，收进我们的小屋。</p><img class="room-cut" src="./room-concept.png" alt="我们现有的3D小屋"><span class="letter-hint">走进我们的小屋 ↗</span><button class="enter-letter" id="letter-enter" aria-label="走进我们的小屋" disabled></button></article><div class="front"></div><div class="lower-seam"></div><div class="flap"></div><div class="address">致我们<span class="tiny-line">a little place for us</span></div><button class="seal" id="open-letter" aria-label="打开这封信"><svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7M6 10v9h12v-9M10 19v-6h4v6"/></svg></button></div>
</section>
<section class="scene ktv-scene" id="ktv-scene" aria-label="私人KTV开场方案" hidden>
<div class="ktv-room"><svg viewBox="0 0 690 470" aria-hidden="true"><defs><linearGradient id="wall" x2="1" y2="1"><stop stop-color="#e8e1dc"/><stop offset="1" stop-color="#c9bcb9"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#c9bbad"/><stop offset="1" stop-color="#e6d6c1"/></linearGradient><linearGradient id="screen" x2="0" y2="1"><stop stop-color="#647263"/><stop offset="1" stop-color="#414e44"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="10"/></filter></defs>
<path d="M118 88 444 56 573 142 248 177Z" fill="#e1d6cf"/><path d="M118 88 444 56 444 283 118 316Z" fill="url(#wall)"/><path d="m444 56 129 86v227l-129-86Z" fill="#bdadae"/><path d="m118 316 326-33 129 86-326 35Z" fill="url(#floor)"/>
<path d="M127 96 437 65M451 71l110 74" stroke="#fff5c7" stroke-width="5" stroke-linecap="round"/><path d="M128 99 437 68M451 74l110 74" stroke="#ffdd8e" stroke-width="12" opacity=".45" filter="url(#soft)"/>
<path d="M270 101 469 82 469 197 270 217Z" fill="#998e82"/><path d="M279 108 460 91 460 188 279 207Z" fill="url(#screen)"/>
<path d="M143 154 187 150v104l-44 5Z" fill="#807674"/><ellipse cx="165" cy="180" rx="12" ry="14" fill="#514f4a"/><ellipse cx="165" cy="230" rx="14" ry="16" fill="#585751"/><path d="m485 155 30 19v101l-30-18Z" fill="#7d7471"/><ellipse cx="500" cy="189" rx="9" ry="13" fill="#514f4a"/><ellipse cx="500" cy="235" rx="10" ry="15" fill="#585751"/>
<path d="m153 280 199-21 72 45-198 21Z" fill="#c4a39b"/><path d="m153 264 199-21 9 44-199 22Z" fill="#c3a29a"/><path d="m162 309 199-22 63 39-198 22Z" fill="#d0b0a5"/><path d="m162 309 64 39v25l-64-39Z" fill="#b89589"/><path d="m226 348 198-22v24l-198 23Z" fill="#c7a99b"/><path d="m153 263 21-2 8 58-20 3Z" fill="#d8b5a6"/><path d="m344 243 18-2 51 32-2 36-20-12-4-19Z" fill="#d9b7a8"/><path d="m193 277 41-5 9 28-43 5Z" fill="#d9d9bf"/>
<path d="m338 325 104-12 68 43-104 12Z" fill="#eed7b3"/><path d="m338 325 68 43v10l-68-43Z" fill="#c8b18e"/><path d="m406 368 104-12v10l-104 12Z" fill="#d7c09d"/><path d="m349 335 11 7v31l-11-7Z" fill="#baa389"/><path d="m479 365 11-1v30l-11 1Z" fill="#baa389"/>
<ellipse cx="420" cy="337" rx="13" ry="6" fill="#b19c8a"/><path d="M410 317h20l-2 21h-16Z" fill="#efe8d8"/><path d="m376 341 19-2 15 9-19 3Z" fill="#657162"/><path d="m377 341-15-10" stroke="#687364" stroke-width="6" stroke-linecap="round"/><ellipse cx="360" cy="329" rx="6" ry="4" fill="#92968a"/>
</svg><button id="ktv-enter" class="screen-button" aria-label="播放我们的房间并进入小屋"><span class="now">FOR US ONLY</span><span class="song">我们的房间</span><span class="play">▶</span></button></div>
</section>
<div class="caption" id="caption"><strong>一封给我们的信</strong>点击封蜡拆信，再点击信中的小屋进入。奶油纸张 · 鼠尾草绿 · 轻柔展开</div>
</main>
<div class="veil"></div><section class="world" id="world" inert aria-hidden="true" aria-label="进入现有3D小屋"><iframe id="room-frame" title="现有3D小屋交互体验" src="about:blank"></iframe><button class="world-back" id="world-back">回到开场方案</button></section>
<script>
const $=id=>document.getElementById(id);let mode='letter',timer=null,enterTimer=null,entering=false;
function reset(){clearTimeout(timer);clearTimeout(enterTimer);entering=false;document.body.classList.remove('entering');$('world').classList.remove('visible');$('world').inert=true;$('world').setAttribute('aria-hidden','true');$('letter-scene').classList.remove('open');$('ktv-scene').classList.remove('playing');$('open-letter').disabled=false;$('letter-enter').disabled=true;$('ktv-enter').disabled=false;}
function choose(next){reset();mode=next;$('letter-scene').hidden=next!=='letter';$('ktv-scene').hidden=next!=='ktv';$('choose-letter').setAttribute('aria-pressed',String(next==='letter'));$('choose-ktv').setAttribute('aria-pressed',String(next==='ktv'));$('caption').replaceChildren();const strong=document.createElement('strong');strong.textContent=next==='letter'?'一封给我们的信':'今夜，留一个房间给我们';$('caption').append(strong,document.createTextNode(next==='letter'?'点击封蜡拆信，再点击信中的小屋进入。奶油纸张 · 鼠尾草绿 · 轻柔展开':'点击屏幕上的播放键进入。私人包厢 · 柔和暖灯 · 投影变成小屋'));}
function enter(){if(entering)return;entering=true;if($('room-frame').getAttribute('src')==='about:blank')$('room-frame').src='../../dist/index.html';if(mode==='ktv')$('ktv-scene').classList.add('playing');document.body.classList.add('entering');enterTimer=setTimeout(()=>{$('world').classList.add('visible');$('world').inert=false;$('world').setAttribute('aria-hidden','false');$('world-back').focus({preventScroll:true});},mode==='ktv'?900:500);}
$('choose-letter').onclick=()=>choose('letter');$('choose-ktv').onclick=()=>choose('ktv');$('replay').onclick=reset;$('world-back').onclick=reset;
$('open-letter').onclick=()=>{$('letter-scene').classList.add('open');$('open-letter').disabled=true;timer=setTimeout(()=>{$('letter-enter').disabled=false;$('letter-enter').focus({preventScroll:true});},1200);};$('letter-enter').onclick=enter;$('ktv-enter').onclick=enter;
</script>
</body></html>
